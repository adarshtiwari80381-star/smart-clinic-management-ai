# Netlify Configuration for Frontend Directory
# Used when Netlify Base Directory is set to "frontend" or when deploying the frontend folder
[build]
  command = "node build.js"
  publish = "."

# Forward API requests directly to the production Render backend
[[redirects]]
  from = "/api/*"
  to = "https://smart-clinic-ai-backend.onrender.com/api/:splat"
  status = 200
  force = true

# Single Page Application (SPA) routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
